[package]
name = "uteke-web"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "OAuth2 auth server + reverse proxy + dashboard for uteke-server"
keywords = ["oauth2", "proxy", "dashboard", "auth", "uteke"]
categories = ["web-programming::http-server", "authentication"]

[[bin]]
name = "uteke-web"
path = "src/main.rs"

[lib]
name = "uteke_web"
path = "src/lib.rs"

[dependencies]
uteke-core = { path = "../uteke-core", version = "0.13.2" }

# CLI
clap = { version = "4", features = ["derive"] }

# Async runtime + HTTP server
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "timeout", "limit"] }

# HTTP client (proxy → uteke-server)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

# Auth crypto
bcrypt = "0.17"
jsonwebtoken = "9"
sha2 = "0.10"
base64 = "0.22"
rand = "0.9"
hmac = "0.12"

# Storage
rusqlite = { version = "0.40", features = ["bundled"] }

# IDs + time
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }

# Logging
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3.1", features = ["env-filter", "registry"] }

# Misc
dirs = "6"
url = "2"
percent-encoding = "2"
urlencoding = "2.1.3"
thiserror = "2"
hex = "0.4"

[dev-dependencies]
tempfile = "3"
tokio-test = "0.4"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
